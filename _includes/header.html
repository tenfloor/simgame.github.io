<header class="top">
  <div class="wrap">
    <a class="logo" href="{{ '/' | relative_url }}" aria-label="{{ site.data.company.name }} {{ site.data.company.name_en }} 홈">{% include logo-mark.svg %}<span class="lw"><b>SIMGAME</b><small>{{ site.data.company.name }}</small></span></a>
    <nav aria-label="주요 메뉴">
      {%- for item in site.data.nav %}
      <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor %}
    </nav>
  </div>
</header>
