# 제품/솔루션 ─ 새 제품은 아래 형식으로 추가하면 됩니다.
#   platforms: 오른쪽에 태그로 표시되는 지원 환경

- name: simDrone
  title: 드론 시뮬레이터
  desc: 가상 환경에서 드론 조종 기술을 반복 연습하고 훈련할 수 있는 시뮬레이션 프로그램입니다.
  platforms: [Windows]

- name: simURMap
  title: 유니티용 Raster Map 엔진
  desc: Unity에서 래스터 지도를 불러와 표시하고 확대·이동·심볼생성 및 관리를 할 수 있게 하는 지도 엔진입니다.
  platforms: [Unity]

- name: simUDGrid
  title: 유니티용 데이터 그리드 라이브러리
  desc: Unity UI에서 데이터 레코드를 테이블 목록으로 전시하고, 선택, 삭제, 정렬, 페이징을 처리해주는 그리드 라이브러리입니다.
  platforms: [Unity]

- name: simVRecorder
  title: 훈련 화면 녹화 프로그램
  desc: 훈련 화면을 영상으로 저장해 사후 강평과 교육 자료로 활용할 수 있게 합니다(타 시스템과 연계/ 원격제어 가능).
  platforms: [Windows]

- name: simAsterix
  title: ASTERIX 라이브러리
  desc: 레이다 감시데이터 국제 표준인 ASTERIX 메시지를 인코딩·디코딩하는 라이브러리입니다.
  platforms: [C++, C#, Java]
