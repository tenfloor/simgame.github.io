# 사업 분야 ─ 항목을 추가하면 사업 분야 페이지와 홈에 카드가 생깁니다.
- tag: ENGAGEMENT SIM
  title: 교전모의기 개발
  desc: 유도로켓, 대공포 등 무기체계의 표적 탐지·추적·교전·판정 과정을 실제 장비 절차와 동일하게 모의합니다.
- tag: VIRTUAL BATTLEFIELD
  title: 3D 가상 전장 구현
  desc: 지형, 기상, 표적 기동을 실시간 3D 환경으로 구현해 다양한 교전 상황을 반복 훈련할 수 있게 합니다.
- tag: SYSTEM INTERFACE
  title: 장비 연동·통신
  desc: ICD 기반으로 실장비 및 상위 체계와 데이터를 주고받고, GPS 시각 동기로 모의 시간을 정밀하게 맞춥니다.
- tag: TRAINING REVIEW
  title: 훈련 기록·평가
  desc: 교전 과정을 기록하고 재생해 사후 강평(AAR)과 사수·운용요원 평가에 활용할 수 있습니다.
- tag: FLIGHT SIM
  title: 드론·UAM 비행 모의
  desc: 드론과 도심항공교통(UAM) 기체의 비행궤적, 비행 시험, 조종 훈련을 가상 환경에서 모의합니다. 전국 드론시험비행장에 드론 모의기를 공급했습니다.
- tag: AVIATION SYSTEM
  title: 항공 정보 시스템
  desc: 비행 및 운항정보 시스템, 공항 여객처리·운영관리 백엔드처럼 항공과 공항 운영의 핵심 시스템을 개발합니다.
